name: CI

# Runs on every push to main and on all pull requests targeting main.
# This workflow is intentionally separate from publish.yml.
# It NEVER publishes packages - it only validates the codebase.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a redundant run on the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # checkout only - no other permissions needed

jobs:
  validate:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Runtime ─────────────────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 3. Install (frozen - reproducible, no silent lockfile changes) ─────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── 4. Typecheck ───────────────────────────────────────────────────────
      - name: Typecheck
        run: bun run typecheck

      # ── 5. Lint ────────────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── 6. Test ────────────────────────────────────────────────────────────
      - name: Test
        run: bun run test

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Build
        run: bun run build

      # ── 8. Workspace integrity check ───────────────────────────────────────
      - name: Workspace check
        run: bun run check:workspace
