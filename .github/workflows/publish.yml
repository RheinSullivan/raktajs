name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (e.g. latest, next, beta)"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-publish:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate versions
        run: |
          RAKTA_VERSION=$(node -p "require('./packages/rakta/package.json').version")
          CREATE_RAKTA_VERSION=$(node -p "require('./packages/create-rakta/package.json').version")

          echo "raktajs version: $RAKTA_VERSION"
          echo "create-rakta-app version: $CREATE_RAKTA_VERSION"

          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            EXPECTED_VERSION="${RELEASE_TAG#v}"

            if [ "$RAKTA_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::raktajs version ($RAKTA_VERSION) does not match release tag ($RELEASE_TAG)"
              exit 1
            fi

            if [ "$CREATE_RAKTA_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::create-rakta-app version ($CREATE_RAKTA_VERSION) does not match release tag ($RELEASE_TAG)"
              exit 1
            fi

            echo "Release version validation passed: $EXPECTED_VERSION"
          else
            echo "workflow_dispatch detected."
            echo "Publishing raktajs@$RAKTA_VERSION"
            echo "Publishing create-rakta-app@$CREATE_RAKTA_VERSION"
          fi

      - name: Check versions are not already published
        run: |
          RAKTA_VERSION=$(node -p "require('./packages/rakta/package.json').version")
          CREATE_RAKTA_VERSION=$(node -p "require('./packages/create-rakta/package.json').version")

          if npm view "raktajs@$RAKTA_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null | grep -Fxq "$RAKTA_VERSION"; then
            echo "::error::raktajs@$RAKTA_VERSION is already published."
            exit 1
          fi

          if npm view "create-rakta-app@$CREATE_RAKTA_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null | grep -Fxq "$CREATE_RAKTA_VERSION"; then
            echo "::error::create-rakta-app@$CREATE_RAKTA_VERSION is already published."
            exit 1
          fi

          echo "npm version conflict check passed."

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Pack raktajs
        run: npm pack --dry-run
        working-directory: packages/rakta

      - name: Pack create-rakta-app
        run: npm pack --dry-run
        working-directory: packages/create-rakta

      - name: Smoke test create-rakta-app CLI
        run: |
          node packages/create-rakta/dist/index.js --version
          node packages/create-rakta/dist/index.js --help

      - name: Publish raktajs
        run: npm publish --access public --tag "${NPM_TAG}"
        working-directory: packages/rakta
        env:
          NPM_TAG: ${{ github.event.inputs.tag || 'latest' }}

      - name: Publish create-rakta-app
        run: npm publish --access public --tag "${NPM_TAG}"
        working-directory: packages/create-rakta
        env:
          NPM_TAG: ${{ github.event.inputs.tag || 'latest' }}
